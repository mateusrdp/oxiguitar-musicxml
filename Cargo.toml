# oxiguitar-musicxml: the MusicXML format plugin for OxiGuitar (#223). One
# plugin file, musicxml.oxp, reading and writing MusicXML (.musicxml, .xml)
# and compressed MusicXML (.mxl).
[package]
name = "oxiguitar-musicxml-plugin"
description = "The OxiGuitar format plugin for MusicXML: reads and writes MusicXML (.musicxml, .xml) and compressed MusicXML (.mxl) files."
# 0.0.0 until the first release: the Release button makes it 0.1.0.
version = "0.0.0"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-musicxml"
homepage = "https://github.com/mateusrdp/oxiguitar-musicxml"
publish = false

[lib]
# An ordinary library for tests, and musicxml.oxp when built with
# `--features oxp --crate-type cdylib` (build-oxp.sh, oxiguitar-plugin-test).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
# OxiGuitar's SDK and score model, by git: interface 1.7 (signatures that
# recognise XML by its first element), which comes with OxiGuitar 0.18.
# OxiGuitar 0.18.0 (oxiguitar#253) is the first release with it.
# Nothing of OxiGuitar's is on crates.io. The reader reads into the core's
# model and converts it for the plugin interface.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0" }
oxiguitar-model = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0", features = ["wire"] }
# MusicXML 4.0, read and written as typed elements (Mateus, 8 Nov 2026:
# this library, as MusicXML 4.0 is the latest release). Exactly as
# published; its own ZIP reader is not used (see src/mxl.rs).
musicxml = "1.1.2"
# Compressed MusicXML is a ZIP container. No default features: they build
# the zstd C library. zlib-rs is a pure-Rust deflate.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The contract suite (tests/contract.rs): builds the .oxp file and checks it
# through OxiGuitar's own plugin host.
oxiguitar-plugin-test = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0" }
serde_json = "1"

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Small files. Keep the default `panic = "unwind"`: a panic is then caught
# and the plugin withdrawn instead of closing OxiGuitar.
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
# The fuzz targets (nightly Rust, see fuzz/README.md) have a workspace and
# lock file of their own.
exclude = ["fuzz"]
